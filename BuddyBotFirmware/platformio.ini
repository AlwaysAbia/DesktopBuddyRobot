; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Migrated from the Arduino IDE sketch Firmware/robot_eye_esp32/robot_eye_esp32.ino.
; Settings below mirror what that sketch was built with:
;   - Arduino IDE board "ESP32 Dev Module" (generic WROOM-32 clone)
;   - arduino-esp32 core 3.2.0
;   - FastLED 3.9.16
;
; Note: `pio pkg install/uninstall` rewrites this file and strips comments.
; Edit lib_deps by hand instead.

[platformio]
default_envs = esp32dev

; ---------- shared settings ----------
[env]
; The official "espressif32" platform is stuck on arduino-esp32 2.0.x.
; pioarduino 54.03.20 ships arduino-esp32 3.2.0 — the same core the Arduino IDE used.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino

; Match Arduino IDE "ESP32 Dev Module" defaults (QIO boot, 80 MHz flash).
; If a clone module fails to boot after flashing, try flash_mode = dio.
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; min_spiffs.csv: two 1.875MB OTA app slots (default.csv has 1.25MB) and a
; 128KB SPIFFS we don't use. nvs/otadata offsets are unchanged, so stored
; settings survive. The partition table can only change via USB upload -
; ThingsBoard OTA never rewrites it.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    fastled/FastLED@3.9.16
    ; ThingsBoard SDK 0.15 requires ArduinoJson 6 (not 7)
    bblanchon/ArduinoJson@6.21.6
    ; ThingsBoard MQTT client + OTA (src/tb_client.cpp, src/ota_update.cpp)
    thingsboard/ThingsBoard@0.15.0
    ; BLE GATT server (src/ble_control.cpp). NimBLE, not Bluedroid: much smaller flash/RAM footprint.
    h2zero/NimBLE-Arduino@2.3.7

; ---------- USB serial upload ----------
; Only used for first flash / recovery. Normal updates go through ThingsBoard OTA.
[env:esp32dev]
